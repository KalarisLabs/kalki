name: Bug report
description: Something Kalki did that it should not have done.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste exact error text.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest sequence of commands that shows it. A failing test is best.
      render: shell
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kalki doctor`
      description: Doctor prints whether keys are set, never their values. Remove anything else private.
      render: text
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Linux x86_64, Linux aarch64, macOS Apple Silicon, macOS Intel, Windows x86_64, Other]
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: "openai-compat via Ollama, qwen3-coder"
  - type: checkboxes
    id: wal
    attributes:
      label: Durability
      options:
        - label: This involves a crash, a kill, or a corrupted session log.
