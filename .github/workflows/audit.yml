name: audit

# Advisory scan runs on a schedule, not per PR: a new RustSec advisory must not
# turn an unrelated pull request red. Failures here open the question on main.
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: ["Cargo.lock", "deny.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
