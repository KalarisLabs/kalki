name: release

# Tag-driven. `git tag -s v0.0.1 && git push origin v0.0.1` builds five targets,
# attests them, and opens a DRAFT GitHub Release. A maintainer publishes it.
# workflow_dispatch runs the same build as a dry run (no release is created).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: tag matches Cargo version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo workspace version: $version"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo version v$version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-15, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, ext: zip }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --package kalki --target "$TARGET"
      - name: smoke test the built binary
        shell: bash
        run: |
          bin="target/$TARGET/release/kalki"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version | grep -F "$VERSION"
          "$bin" doctor
      - name: package
        shell: bash
        run: |
          name="kalki-v$VERSION-$TARGET"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE CHANGELOG.md "$name/"
          if [ -f "target/$TARGET/release/kalki.exe" ]; then
            cp "target/$TARGET/release/kalki.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/$TARGET/release/kalki" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalki-${{ matrix.target }}
          path: kalki-v*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum kalki-v* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kalki-v*
      - name: release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --draft --prerelease \
            --title "Kalki $TAG" \
            --notes-file notes.md \
            --verify-tag
