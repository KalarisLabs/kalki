[workspace]
resolver = "2"
members = ["crates/kalki", "crates/kalki-core", "crates/kalki-protocol", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KalarisLabs/kalki"
homepage = "https://kalarislabs.com"
authors = ["Sayan Chowdhury <hello@kalarislabs.com>"]
description = "Kalki — a recursively self-improving coding harness with admission control, written in Rust"
keywords = ["coding-agent", "llm", "harness", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
kalki-protocol = { path = "crates/kalki-protocol", version = "0.0.1" }
kalki-core = { path = "crates/kalki-core", version = "0.0.1" }

# --- runtime ---
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "process", "signal", "io-std"] }

# --- http / providers ---
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "stream"] }

# --- serialization ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# --- observability ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }

# --- test-only: loopback mock model server ---
axum = "0.8.9"

# --- cli ---
clap = { version = "4.5.53", features = ["derive", "wrap_help", "env"] }

# --- errors ---
thiserror = "2.0.17"
anyhow = "1.0.100"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
